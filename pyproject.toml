[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memory-bench"
version = "0.1.0"
description = "One stream, one meter, one board: open-source and licensed agent memory systems, head to head."
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.scripts]
memorybench = "memorybench.cli:main"

[tool.setuptools]
packages = ["memorybench"]
